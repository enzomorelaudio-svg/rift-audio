<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafaf8">
<script>
/* applique le thème avant l'affichage (évite le flash) : choix enregistré, sinon mode clair */
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(t!=='light'&&t!=='dark')t='light';
document.documentElement.dataset.theme=t;
var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='light'?'#fafaf8':'#000000';})();
</script>
<title>Rift Audio – Création sonore et musicale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fafaf8;--fg:#111;--mute:#6b6b6b;--line:#dcdcd8;--soft:#4a4a4a;--dash:#b8b8b4;--btn:#c4c4c0;--cell:#d2d2ce;--beat:#a2a29e;--thumb:#e6e6e2;--backdrop:rgba(250,250,248,.55);--cell-glow:rgba(0,0,0,.35);--on-fg:#fafaf8;
  --st-idle:#8c8c88;--st-on:#000;--st-glow:none;--st-box-bg:#0030a0;--st-box-fg:#fff;--st-sub:#111;
  --gap:clamp(12px,2vw,28px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--fg:#f2f2f2;--mute:#7d7d7d;--line:#222;--soft:#bdbdbd;--dash:#555;--btn:#333;--cell:#2a2a2a;--beat:#585858;--thumb:#111;--backdrop:rgba(0,0,0,.55);--cell-glow:rgba(255,255,255,.65);--on-fg:#000;
  --st-idle:#a5a5a5;--st-on:#fff;--st-glow:0 0 .14em rgba(255,255,255,.95),0 0 .45em rgba(255,255,255,.5);--st-box-bg:#fff;--st-box-fg:#0030a0;--st-sub:#fff;}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;scroll-behavior:smooth}
body{min-height:100vh;padding:clamp(20px,4vw,64px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:4px}

header{display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:clamp(16px,2.5vw,32px);row-gap:20px;margin-bottom:clamp(56px,8vw,100px)}
@media (max-width:820px){header{grid-template-columns:1fr auto;row-gap:38px}.brand{grid-column:1;grid-row:1}.theme-btn{grid-column:2;grid-row:1}header p{grid-column:1/-1;grid-row:2}}
.brand{display:flex;align-items:center;gap:clamp(12px,2vw,28px)}
h1{font-weight:600;font-size:clamp(1.8rem,4.5vw,3.5rem);line-height:1;letter-spacing:-.03em}
.title{position:relative}
.by{position:absolute;left:.15em;top:100%;margin-top:.5em;font-size:.9rem;font-weight:400;letter-spacing:.01em;color:var(--mute);white-space:nowrap}
header p{color:var(--mute);max-width:28ch;font-size:.95rem;line-height:1.5}

.string-wrap{width:clamp(120px,16vw,220px)}
#string{display:block;width:100%;height:56px;touch-action:none;cursor:crosshair}

nav{display:flex;gap:20px;margin-bottom:var(--gap);font-size:.95rem}
nav button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:4px 0;border-bottom:1px solid transparent}
nav button:hover{color:var(--fg)}
nav button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:var(--gap)}
.card{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:block;width:100%}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--thumb)}
.thumb img,.thumb video,.thumb .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease,opacity .3s}
.thumb .ph{background:linear-gradient(135deg,var(--c1),#000)}
.thumb video{opacity:0}
.card:hover .thumb video.on{opacity:1}
.card:hover .thumb img,.card:hover .thumb .ph{transform:scale(1.04)}
.meta{display:flex;justify-content:space-between;gap:12px;padding:14px 0 0;font-size:.95rem}
.meta .yr{color:var(--mute)}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.end{display:flex;align-items:center;gap:10px;flex:none}
.tag{flex:none;color:var(--fg);border:1px solid var(--fg);border-radius:999px;padding:2px 8px;font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1.4}
.hidden,.more-hidden{display:none}
.see-more{display:block;margin:var(--gap) auto 0;background:none;border:1px solid var(--btn);color:var(--fg);font:inherit;font-size:.95rem;padding:12px 28px;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
.see-more:hover{border-color:var(--fg)}
.see-more[hidden]{display:none}

footer{margin-top:clamp(64px,12vw,160px);padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--mute);font-size:.9rem}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--fg)}
.contact{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.contact a{width:fit-content}

dialog{border:0;background:var(--bg);color:var(--fg);width:min(900px,88vw);max-height:90vh;padding:0;overflow:auto;margin:auto;inset:0}
dialog::backdrop{background:var(--backdrop);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.player{aspect-ratio:16/9;background:#000;width:100%}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.info{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:18px 22px 22px;flex-wrap:wrap}
.info h2{font-weight:600;font-size:1.3rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.info p{color:var(--mute);max-width:60ch;line-height:1.5;margin-top:6px}
.close{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 16px;cursor:pointer}
.close:hover{border-color:var(--fg)}


/* ---- Bouton clair / sombre ---- */
.theme-btn{flex:none;width:36px;height:36px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;color:var(--mute);cursor:pointer;padding:0;transition:color .2s,border-color .2s}
.theme-btn:hover{color:var(--fg);border-color:var(--fg)}
.theme-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
:root[data-theme="dark"] .theme-btn .moon{display:none}

/* ---- Expérience / carrière ---- */
.career{margin-top:clamp(72px,12vw,160px)}
.career h2 small{display:block;margin-top:6px;font-size:.5em;letter-spacing:-.02em;color:#4BF8A5}
.steps{list-style:none;padding:0 0 0 28px;margin:clamp(32px,5vw,56px) 0 0;border-left:1px dashed var(--dash)}
.step{position:relative;margin-bottom:36px;font-size:.92rem;line-height:1.5}
.step:last-child{margin-bottom:0}
.step::before{content:"";position:absolute;left:-33px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--fg)}
.step img{display:block;width:100%;max-width:240px;aspect-ratio:2/1;object-fit:cover;border-radius:14px;margin:0 0 12px}
.step .role{display:block;font-weight:600}
.step .pl{display:block;color:var(--soft)}
.step .date{display:block;margin-top:4px;font-weight:600}


/* ---- Drum machine ---- */
.career-body{display:grid;gap:clamp(40px,7vw,100px);align-items:start}
@media (min-width:960px){.career-body{grid-template-columns:minmax(240px,1fr) minmax(380px,1.25fr)}}
.drum{margin-top:clamp(32px,5vw,56px);font-size:.85rem;max-width:580px}
.drum button{font:inherit;color:inherit;cursor:pointer}
.drum-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.drum-head h3{font-weight:600;font-size:.95rem;margin-right:auto}
.d-btn{background:none;border:1px solid var(--btn);padding:6px 14px;min-width:64px}
.d-btn:hover{border-color:var(--fg)}
.d-btn[aria-pressed="true"]{background:var(--fg);color:var(--on-fg);border-color:var(--fg)}
.bpm{display:flex;align-items:center;gap:8px;color:var(--mute)}
.bpm input{width:90px;accent-color:var(--fg)}
.bpm output{min-width:2.4em;color:var(--fg)}
.seq{display:grid;gap:6px}
.d-row{display:grid;grid-template-columns:56px repeat(16,minmax(0,1fr));gap:3px;align-items:center}
.d-row .lbl{background:none;border:0;text-align:left;color:var(--soft);padding:6px 0;transition:color .1s}
.d-row .lbl:hover,.d-row .lbl.flash{color:var(--fg)}
.cell{aspect-ratio:1;background:none;border:1px solid var(--cell);padding:0;min-width:0}
.d-row .cell:nth-child(4n+2){border-color:var(--beat)}
.cell:hover{border-color:var(--fg)}
.cell.on{background:var(--fg);border-color:var(--fg)}
.cell.playing{border-color:var(--fg)}
.cell.on.playing{box-shadow:0 0 10px var(--cell-glow)}


/* ---- Vidéo d'intro ---- */
.reel{margin:0 0 clamp(32px,5vw,64px)}
.reel-stage{position:relative;width:50%;margin:0 auto;aspect-ratio:16/9;background:var(--bg);overflow:hidden;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;user-select:none}
.reel-stage .rw{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;text-transform:uppercase;transform-origin:0 0;color:var(--st-idle)}
.reel-stage .rw.on{color:var(--st-on);text-shadow:var(--st-glow)}
.reel-stage .rw.blue{color:var(--st-box-fg)}
.reel-stage .rw.sub{color:var(--st-sub)}
.reel-stage .rbox{position:absolute;background:var(--st-box-bg)}
@media (max-width:760px){.reel-stage{width:100%}}

.projects-section{margin:0 auto clamp(48px,7vw,88px);}
/* Titres de section : même taille, même graisse, même typo */
.projects-section h2,.career h2{font-size:clamp(1.7rem,3vw,2.4rem);font-weight:500;line-height:1;letter-spacing:-.04em;text-transform:none}
.projects-section h2{margin:0 0 24px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<script>
/* ============ VOS PROJETS : modifiez uniquement cette liste ============
   title    : titre du projet
   year     : année
   category : catégorie (sert aux filtres)
   desc     : courte description
   cover    : image de couverture (ex. "img/projet1.jpg") — optionnel
   preview  : courte vidéo muette jouée au survol (ex. "video/projet1-preview.mp4") — optionnel
   video    : lien YouTube ou Vimeo, OU fichier local (ex. "video/projet1.mp4")
   tag      : étiquette verte optionnelle à droite du titre (ex. "New") ; plusieurs : ["New","Music"]
   color    : couleur du placeholder si pas de cover
======================================================================== */
const PROJECTS = [
  {title:"Directorate Novitiate",   year:2025, category:"Video games", desc:"Technical sound designer & music composer at DOKI DOKI for this game",cover: "Riftaudio_Website/img:/Directorate_Novitiate_Cover.jpg", video:"https://www.youtube.com/watch?v=E3ucnmZaJm0", color:"#2b2b3a"},
  {title:"Fimo AI", year:2026, category:"Ads/Branding",         desc:"This is an audio signature made for Fimo AI, a revolutionnary website maker",cover:"Riftaudio_Website/img:/Fimo_Cover.png" , video:"https://youtu.be/vhexJwUIx_8?si=PZAyZHFK2KF2NTWU",                   color:"#3a2b2b"},
  {title:"Le dernier Don",year:2025, category:"Video games", desc:"Technical sound designer & music composer for this game",cover:"Riftaudio_Website/img:/LedernierDon_Cover.jpg", video:"https://www.youtube.com/watch?v=zgwEVFJeS2Y&t=429s",                            color:"#2b3a35"},
  {title:"Valorant",year:2024,tag:"sound re-design",category:"Video games", desc:"This is a sound redesign including the voice recording, the sound design and the music scoring !",cover:"Riftaudio_Website/img:/Valorant_cover.jpg", video:"https://youtu.be/ceIDa797WoI?si=5N7mWtD10SEU78GX",                            color:"#35342b"},
  {title:"Inception", year:2024,tag:"sound re-design", category:"Movies", desc:"This is a sound redesign including the voice recording.",cover:"Riftaudio_Website/img:/Inception_cover.jpg", video:"https://youtu.be/_rZOOfN8jjM",                            color:"#2b2f3a"},
  {title:"Tocata",  year:2026, category:"Movies", desc:"Sound design and music addition on the masterpiece made by Bach and with this dance video made directed by Mariana Benenge & Leo Poulain ", cover:"Riftaudio_Website/img:/projet1.jpg", video:"https://youtu.be/KZx7wax4ekA?si=Y7iR0DBrwnfH5ASy",                            color:"#322b3a"},
  {title:"R6",  year:2026, category:"Video games", desc:"r6", video:"https://drive.google.com/file/d/1vtCPvLjRKlzExkfxManbQXlAVUZR9-F1/view",                            color:"#322b3a"},
];
/* ====================================================================== */
/* ============ VOTRE PARCOURS : modifiez cette liste ============
   role  : poste (en gras)
   place : lieu / entreprise (une ligne, ou plusieurs : ["Ligne 1","Ligne 2"])
   date  : période
   img   : image optionnelle ("doki" = image intégrée, ou un chemin comme "img/photo.jpg")
   alt   : description de l'image   |   pos : cadrage de l'image (ex. "center 25%")
   Les étapes s'affichent de haut en bas, dans l'ordre de la liste.
================================================================ */
const CAREER = [
  {role:"Freelance live Sound Engineer", place:["Gab Bouchard FOH","Ville d\u2019Alma Spectacle","Le café du clocher","Solotech (The Weekend Preproduction, After Hour world tour)"], date:"2021 – 2024"},
  {role:"Lead technical Sound designer", place:"Le dernier Don", date:"03/24 – 07/24"},
  {role:"Technical sound designer & music composer", place:"DOKI DOKI", date:"2024 – 2025"},
  {role:"Sound designer", place:"RIFT AUDIO (my company)", date:"2026"},
  {role:"AV Technician", place:"Domaine des Ormes", date:"2026"}
];


const grid=document.getElementById('grid'), filters=document.getElementById('filters');
const modal=document.getElementById('modal'), player=document.getElementById('player');

function embedUrl(u){
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  if(m) return {type:'iframe',src:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0`};
  m=u.match(/vimeo\.com\/(\d+)/);
  if(m) return {type:'iframe',src:`https://player.vimeo.com/video/${m[1]}?autoplay=1`};
  return {type:'video',src:u};
}

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tagsHtml=p=>[].concat(p.tag||[]).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');

function render(){
  grid.innerHTML='';
  PROJECTS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='card'; b.dataset.cat=p.category;
    b.setAttribute('aria-label',`Lire ${p.title}`);
    const cover=p.cover?`<img src="${p.cover}" alt="" loading="lazy">`:`<div class="ph" style="--c1:${p.color||'#222'}"></div>`;
    const prev=p.preview?`<video src="${p.preview}" muted loop playsinline preload="none"></video>`:'';
    b.innerHTML=`<div class="thumb">${cover}${prev}</div><div class="meta"><span class="ttl"><span>${p.title}</span></span><span class="end">${tagsHtml(p)}<span class="yr">${p.year}</span></span></div>`;
    const v=b.querySelector('video');
    if(v){
      b.addEventListener('mouseenter',()=>{v.classList.add('on');v.play().catch(()=>{})});
      b.addEventListener('mouseleave',()=>{v.classList.remove('on');v.pause();v.currentTime=0});
    }
    b.addEventListener('click',()=>open(p));
    grid.appendChild(b);
  });

const themeBuf={};
function decodeTheme(){
  Object.keys(THEME_SND).forEach(k=>{
    try{
      const bin=atob(THEME_SND[k].split(',')[1]), u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      actx.decodeAudioData(u8.buffer,b=>{themeBuf[k]=b},()=>{});
    }catch(e){}
  });
}
function playTheme(k){
  if(!actx)initAudio();
  try{
    if(actx&&actx.state==='suspended')actx.resume();
    if(actx&&themeBuf[k]){
      const src=actx.createBufferSource(), g=actx.createGain();
      src.buffer=themeBuf[k]; g.gain.value=0.8; src.connect(g); g.connect(actx.destination); src.start(0);
      return;
    }
  }catch(e){}
  const a=new Audio(THEME_SND[k]); a.volume=0.8; a.play().catch(()=>{});   // secours si le décodage n'est pas fini
}

function buildFilters(){
  const cats=['Tout',...new Set(PROJECTS.map(p=>p.category))];
  cats.forEach((c,i)=>{
    const b=document.createElement('button');
    b.textContent=c; b.setAttribute('aria-pressed',i===0);
    b.addEventListener('click',()=>{
      playUi();
      filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      grid.querySelectorAll('.card').forEach(card=>card.classList.toggle('hidden',c!=='Tout'&&card.dataset.cat!==c));
      showAll=false; updateMore();
    });
    filters.appendChild(b);
  });
}

    ?`<iframe src="${e.src}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${p.title}"></iframe>`
    :`<video src="${e.src}" controls autoplay playsinline></video>`;
  document.getElementById('mTitle').innerHTML=`<span>${esc(p.title)} (${p.year})</span>`+tagsHtml(p);
  document.getElementById('mDesc').textContent=p.desc;
  modal.showModal();
}
function closeModal(){player.innerHTML='';modal.close()}
document.getElementById('close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
modal.addEventListener('cancel',()=>{player.innerHTML=''});

let pluckBuf=null;
function decodePluck(){
  try{
    const bin=atob(PLUCK_SND.split(',')[1]), u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    actx.decodeAudioData(u8.buffer,b=>{pluckBuf=b},()=>{});
  }catch(e){}
}
function playPluck(strength){
  try{
    if(!actx)initAudio();
    if(actx.state==='suspended')actx.resume();
    if(!pluckBuf)return;
    const src=actx.createBufferSource(), g=actx.createGain();
    src.buffer=pluckBuf;
    g.gain.value=0.35+0.65*Math.max(0,Math.min(1,strength));   // plus la corde est tirée, plus c'est fort
    src.connect(g); g.connect(actx.destination); src.start(0);
  }catch(e){}
}
// Les navigateurs n'autorisent le son qu'après un premier clic ou toucher : on prépare l'audio à ce moment-là.
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!actx)initAudio();
  if(actx&&actx.state==='suspended')actx.resume();
},{passive:true}));

/* ---- Corde de guitare interactive ---- */
/* La corde vibre d'un seul bloc (mode fondamental) : un arc qui monte et descend,
   sans onde qui voyage de gauche à droite. */
(function(){
  const cv=document.getElementById('string'), ctx=cv.getContext('2d');
  const N=80,          // points de dessin (lissage)
        MAXPULL=22,    // distance de pincement max (px)
        GAIN=1.1,      // amplification de l'amplitude
        FREQ=2.2,      // vitesse de vibration (Hz) : plus bas = plus lent
        TAU=0.9,       // durée d'amortissement (s) : plus haut = vibre plus longtemps
        PAD=6;
  const W0=2*Math.PI*FREQ;
  let W=0,H=0,color='#fff',running=false,grabbed=false,prev=null;
  let amp=0, vel=0, target=0, last=0;

  const px=i=>PAD+(W-2*PAD)*i/(N-1);

  function size(){
    const dpr=window.devicePixelRatio||1;
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    color=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#fff';
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const cy=H/2;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.5; ctx.lineCap='round';
    const Y=i=>cy+amp*Math.sin(Math.PI*i/(N-1));   // toute la corde, même forme
    ctx.beginPath(); ctx.moveTo(px(0),Y(0));
    for(let i=1;i<N-1;i++){
      ctx.quadraticCurveTo(px(i),Y(i),(px(i)+px(i+1))/2,(Y(i)+Y(i+1))/2);
    }
    ctx.lineTo(px(N-1),Y(N-1)); ctx.stroke();
    [0,N-1].forEach(i=>{ctx.beginPath();ctx.arc(px(i),cy,2.5,0,Math.PI*2);ctx.fill()});
  }
  function loop(t){
    const dt=Math.min((t-last)/1000||0.016,0.033); last=t;
    if(grabbed){
      amp+=(target-amp)*0.35; vel=0;            // la corde suit la souris
    }else{
      // oscillation amortie : amp(t) = A0 · e^(-t/TAU) · cos(ωt)
      vel+=(-W0*W0*amp-(2/TAU)*vel)*dt;
      amp+=vel*dt;
    }
    draw();
    if(grabbed||Math.abs(amp)>0.15||Math.abs(vel)>2) requestAnimationFrame(loop);
    else{amp=0;vel=0;running=false;draw()}
  }
  function start(){ if(!running){running=true;last=performance.now();requestAnimationFrame(loop)} }
  function release(){ grabbed=false; playPluck(Math.abs(amp)/(MAXPULL*GAIN)); start(); }

  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    const cyv=e.clientY-r.top-H/2;
    const clamp=Math.max(-MAXPULL,Math.min(MAXPULL,cyv))*GAIN;
    if(prev!==null && !grabbed && Math.sign(prev)!==Math.sign(cyv) && cyv!==0){
      // la souris traverse la corde : on la pince
      target=clamp; grabbed=true;
      if(Math.abs(cyv)>=MAXPULL){amp=target;release()}   // passage rapide : elle part tout de suite

function renderCareer(){
  const ol=document.getElementById('steps');
  CAREER.forEach((c,i)=>{
    const li=document.createElement('li');
    li.className='step'; 
    const src=c.img&&(CAREER_IMGS[c.img]||c.img);
    li.innerHTML=
      (src?`<img src="${src}" alt="${esc(c.alt||c.role)}" loading="lazy"${c.pos?` style="object-position:${esc(c.pos)}"`:''}>`:'')+
      `<b class="role">${esc(c.role)}</b>`+
      [].concat(c.place||[]).map(x=>`<span class="pl">${esc(x)}</span>`).join('')+
      `<span class="date">${esc(c.date)}</span>`;
    ol.appendChild(li);
  });
}

/* ---- Drum machine (sons synthétisés, aucun fichier audio) ---- */
(function(){
  const root=document.getElementById('drum'); if(!root) return;
  const ROWS=['Kick','Snare','Hi-hat','Tom 1','Tom 2','Tom 3'], STEPS=16;
  const pat=ROWS.map(()=>Array(STEPS).fill(false));
  [[0,8,10],[4,12],[0,2,4,6,8,10,12,14],[13],[14],[15]].forEach((a,r)=>a.forEach(i=>pat[r][i]=true));
  let bpm=100, playing=false, step=0, nextTime=0, timer=null, last=-1, out=null, noiseBuf=null;

  function ready(){
    if(!actx) initAudio();
    if(!actx) return false;
    if(actx.state==='suspended') actx.resume();
    return true;
  }
  const bus=()=>{
    if(!out||out.context!==actx){
      const c=actx.createDynamicsCompressor(), g=actx.createGain();
      g.gain.value=0.9; c.connect(g); g.connect(actx.destination); out=c;
    }
    return out;
  };
  const noise=()=>{
    if(!noiseBuf||noiseBuf.sampleRate!==actx.sampleRate){
      noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    return noiseBuf;
  };
  const env=(g,t,peak,dur)=>{g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur)};
  const osc=(type,f0,f1,sweep,t,peak,dur)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+sweep);
    env(g,t,peak,dur); o.connect(g); g.connect(bus()); o.start(t); o.stop(t+dur+0.05);
  };
  const hiss=(freq,peak,dur,t)=>{
    const n=actx.createBufferSource(), f=actx.createBiquadFilter(), g=actx.createGain();
    n.buffer=noise(); f.type='highpass'; f.frequency.value=freq;
    env(g,t,peak,dur); n.connect(f); f.connect(g); g.connect(bus()); n.start(t,Math.random()*0.5); n.stop(t+dur+0.05);
  };
  const voices=[
    t=>osc('sine',150,42,0.14,t,1,0.45),                                  // kick
    t=>{hiss(1400,0.8,0.2,t); osc('triangle',190,120,0.08,t,0.55,0.12)},  // snare
    t=>hiss(7000,0.45,0.05,t),                                            // hi-hat
    t=>osc('sine',240,120,0.18,t,0.9,0.35),                               // tom 1
    t=>osc('sine',170,85,0.2,t,0.9,0.42),                                 // tom 2
    t=>osc('sine',120,60,0.22,t,0.95,0.5)                                 // tom 3
  ];

  // ----- Interface -----
  root.innerHTML=`<div class="drum-head">
    <h3>Drum machine</h3>
    <button class="d-btn" id="dPlay" aria-pressed="false">Play</button>
    <button class="d-btn" id="dClear">Clear</button>
    <label class="bpm">BPM <input type="range" id="dBpm" min="60" max="180" value="${bpm}"> <output id="dBpmVal">${bpm}</output></label>
  </div><div class="seq" id="dSeq"></div>`;
  const seq=root.querySelector('#dSeq'), cells=[], labels=[];
  ROWS.forEach((name,r)=>{
    const row=document.createElement('div'); row.className='d-row';
    const lb=document.createElement('button'); lb.className='lbl'; lb.textContent=name;
    lb.setAttribute('aria-label',`Jouer ${name}`);
    lb.addEventListener('click',()=>hit(r));
    row.appendChild(lb); labels.push(lb); cells[r]=[];
    for(let i=0;i<STEPS;i++){
      const c=document.createElement('button'); c.className='cell'+(pat[r][i]?' on':'');
      c.setAttribute('aria-pressed',pat[r][i]); c.setAttribute('aria-label',`${name}, pas ${i+1}`);
      c.addEventListener('click',()=>{
        pat[r][i]=!pat[r][i]; c.classList.toggle('on',pat[r][i]); c.setAttribute('aria-pressed',pat[r][i]);
        if(pat[r][i]&&!playing) hit(r);
      });
      row.appendChild(c); cells[r][i]=c;
    }
    seq.appendChild(row);
  });

  function hit(r){
    if(!ready()) return;
    voices[r](actx.currentTime+0.001);
    labels[r].classList.add('flash'); setTimeout(()=>labels[r].classList.remove('flash'),120);
  }
  function head(i){
    if(last>=0) cells.forEach(row=>row[last].classList.remove('playing'));
    if(i>=0) cells.forEach(row=>row[i].classList.add('playing'));
    last=i;
  }

  // ----- Séquenceur (lecture planifiée avec marge d'avance pour un rythme stable) -----
  function tick(){
    while(nextTime<actx.currentTime+0.12){
      const s=step, t=nextTime;
      pat.forEach((row,r)=>{ if(row[s]) voices[r](t); });
      setTimeout(()=>{ if(playing) head(s); },Math.max(0,(t-actx.currentTime)*1000));
      nextTime+=60/bpm/4; step=(step+1)%STEPS;
    }
  }
  const btn=root.querySelector('#dPlay');
  function setPlay(on){
    if(on){
      if(!ready()) return;
      playing=true; step=0; nextTime=actx.currentTime+0.06;
      timer=setInterval(tick,25); tick();
    }else{
      playing=false; clearInterval(timer); head(-1);
    }
    btn.textContent=on?'Stop':'Play'; btn.setAttribute('aria-pressed',on);
  }
  btn.addEventListener('click',()=>setPlay(!playing));
  root.querySelector('#dClear').addEventListener('click',()=>{
    pat.forEach((row,r)=>row.forEach((_,i)=>{row[i]=false;cells[r][i].classList.remove('on');cells[r][i].setAttribute('aria-pressed',false)}));
  });
  const slider=root.querySelector('#dBpm'), val=root.querySelector('#dBpmVal');
  slider.addEventListener('input',()=>{bpm=+slider.value; val.textContent=bpm;});
})();

    {t:'For all your projects',cls:'sub', x:363,  y:278,  w:234,  cap:13}
  ];
  const items=[...WORDS,...extra].map(d=>{
    const el=document.createElement('span'); el.className='rw'+(d.cls?' '+d.cls:''); el.textContent=d.t; el.setAttribute('aria-hidden','true');
    stage.appendChild(el); d.el=el; d.on=false; return d;
  });
  function layout(){
    const u=stage.clientWidth/960; if(!u) return;
    box.style.cssText=`left:${BOX.x*u}px;top:${BOX.y*u}px;width:${BOX.w*u}px;height:${BOX.h*u}px`;
    items.forEach(d=>{
      const el=d.el, fs=d.cap*u/0.7;                 // hauteur des capitales ≈ 0,7 em
      el.style.fontSize=fs+'px';
      el.style.transform='none';
      const nat=el.offsetWidth||1, sx=Math.max(.5,Math.min(1.3,d.w*u/nat));
      el.style.left=d.x*u+'px';
      el.style.top=(d.y*u-0.146*fs)+'px';          // aligne le haut des capitales sur y
      el.style.transform=`scaleX(${sx})`;
    });
  }
  layout();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
  if('ResizeObserver' in window) new ResizeObserver(layout).observe(stage); else addEventListener('resize',layout);

  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;   // texte fixe, sans animation
  let raf=0,t0=0,visible=true;
  function tick(now){
    const p=((now-t0)/1000)%CYCLE;
    WORDS.forEach(d=>{const on=p>=d.s&&p<d.e; if(on!==d.on){d.on=on;d.el.classList.toggle('on',on);}});
    raf=requestAnimationFrame(tick);
  }
  function start(){ if(!raf){t0=performance.now();raf=requestAnimationFrame(tick);} }
  function stop(){ cancelAnimationFrame(raf);raf=0;WORDS.forEach(d=>{d.on=false;d.el.classList.remove('on');}); }
  if('IntersectionObserver' in window) new IntersectionObserver(e=>{visible=e[0].isIntersecting; visible?start():stop();}).observe(stage); else start();
})();

/* ---- Galerie sur téléphone : on n'affiche que les premiers projets + bouton « See more » ---- */
const PHONE_LIMIT=4, phoneMq=matchMedia('(max-width:760px)'), seeMore=document.getElementById('seeMore');
let showAll=false;
function updateMore(){
  const cards=[...grid.querySelectorAll('.card:not(.hidden)')];
  const collapse=phoneMq.matches&&!showAll;
  cards.forEach((c,i)=>c.classList.toggle('more-hidden',collapse&&i>=PHONE_LIMIT));
  grid.querySelectorAll('.card.hidden').forEach(c=>c.classList.remove('more-hidden'));
  const needed=phoneMq.matches&&cards.length>PHONE_LIMIT;
  seeMore.hidden=!needed;
  seeMore.setAttribute('aria-expanded',showAll);
  seeMore.textContent=showAll?'See less':'See more ('+Math.max(0,cards.length-PHONE_LIMIT)+')';
}
seeMore.addEventListener('click',()=>{
  playUi();
  showAll=!showAll; updateMore();
  if(!showAll) document.getElementById('projectsTitle').scrollIntoView({behavior:'smooth',block:'start'});
});
phoneMq.addEventListener('change',updateMore);

/* ---- Thème clair / sombre ---- */
(function(){
  const btn=document.getElementById('themeBtn'), root=document.documentElement;
  const meta=document.querySelector('meta[name="theme-color"]');
  function apply(t,save){
    root.dataset.theme=t;
    if(meta) meta.content=t==='light'?'#fafaf8':'#000000';
    btn.setAttribute('aria-label',t==='light'?'Passer en mode sombre':'Passer en mode clair');
    if(save){try{localStorage.setItem('theme',t)}catch(e){} playTheme(t);}
    dispatchEvent(new Event('themechange'));
  }
  btn.setAttribute('aria-label',root.dataset.theme==='light'?'Passer en mode sombre':'Passer en mode clair');
  btn.addEventListener('click',()=>apply(root.dataset.theme==='light'?'dark':'light',true));
})();

initAudio();   // prépare les sons dès le chargement (le navigateur les lance au 1er clic)
buildFilters(); render(); renderCareer(); updateMore();
</script>
