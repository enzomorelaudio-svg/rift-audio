<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rift Audio – Création sonore et musicale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f2f2f2;--mute:#7d7d7d;--line:#222;--gap:clamp(12px,2vw,28px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;scroll-behavior:smooth}
body{min-height:100vh;padding:clamp(20px,4vw,64px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:4px}

header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:clamp(32px,5vw,64px)}
.brand{display:flex;align-items:center;gap:clamp(12px,2vw,28px)}
h1{font-weight:600;font-size:clamp(1.8rem,4.5vw,3.5rem);line-height:1;letter-spacing:-.03em}
header p{color:var(--mute);max-width:28ch;font-size:.95rem;line-height:1.5}

.string-wrap{width:clamp(120px,16vw,220px)}
#string{display:block;width:100%;height:56px;touch-action:none;cursor:crosshair}

nav{display:flex;gap:20px;margin-bottom:var(--gap);font-size:.95rem}
nav button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:4px 0;border-bottom:1px solid transparent}
nav button:hover{color:var(--fg)}
nav button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:var(--gap)}
.card{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:block;width:100%}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#111}
.thumb img,.thumb video,.thumb .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease,opacity .3s}
.thumb .ph{background:linear-gradient(135deg,var(--c1),#000)}
.thumb video{opacity:0}
.card:hover .thumb video.on{opacity:1}
.card:hover .thumb img,.card:hover .thumb .ph{transform:scale(1.04)}
.meta{display:flex;justify-content:space-between;gap:12px;padding:14px 0 0;font-size:.95rem}
.meta span:last-child{color:var(--mute)}
.hidden{display:none}

footer{margin-top:clamp(64px,12vw,160px);padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:var(--mute);font-size:.9rem}
footer a{text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--fg)}

dialog{border:0;background:#000;color:var(--fg);width:min(900px,88vw);max-height:90vh;padding:0;overflow:auto;margin:auto;inset:0}
dialog::backdrop{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.player{aspect-ratio:16/9;background:#000;width:100%}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.info{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:18px 22px 22px;flex-wrap:wrap}
.info h2{font-weight:600;font-size:1.3rem}
.info p{color:var(--mute);max-width:60ch;line-height:1.5;margin-top:6px}
.close{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 16px;cursor:pointer}
.close:hover{border-color:var(--fg)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Rift Audio</h1>
    <div class="string-wrap"><canvas id="string" role="img" aria-label="Corde de guitare interactive : passez la souris dessus pour la faire vibrer"></canvas></div>
  </div>
  <p>Création sonore et musicale pour le jeu vidéo, la publicité et les expériences interactives.</p>
</header>

<nav id="filters" aria-label="Filtrer les projets"></nav>
<main class="grid" id="grid"></main>

<footer>
  <span>© 2026 Rift Audio</span>
  <a href="mailto:contact@exemple.fr">contact@exemple.fr</a>
</footer>

<dialog id="modal" aria-label="Lecteur vidéo">
  <div class="player" id="player"></div>
  <div class="info">
    <div><h2 id="mTitle"></h2><p id="mDesc"></p></div>
    <button class="close" id="close">Fermer</button>
  </div>
</dialog>

   title    : titre du projet
   year     : année
   category : catégorie (sert aux filtres)
   desc     : courte description
   cover    : image de couverture (ex. "img/projet1.jpg") — optionnel
   preview  : courte vidéo muette jouée au survol (ex. "video/projet1-preview.mp4") — optionnel
   video    : lien YouTube ou Vimeo, OU fichier local (ex. "video/projet1.mp4")
   color    : couleur du placeholder si pas de cover
======================================================================== */

];
/* ====================================================================== */

const grid=document.getElementById('grid'), filters=document.getElementById('filters');
const modal=document.getElementById('modal'), player=document.getElementById('player');

function embedUrl(u){
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})/);
  if(m) return {type:'iframe',src:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0`};
  m=u.match(/vimeo\.com\/(\d+)/);
  if(m) return {type:'iframe',src:`https://player.vimeo.com/video/${m[1]}?autoplay=1`};
  return {type:'video',src:u};
}

function render(){
  grid.innerHTML='';
  PROJECTS.forEach((p,i)=>{
    const b=document.createElement('button');
    b.className='card'; b.dataset.cat=p.category;
    b.setAttribute('aria-label',`Lire ${p.title}`);
    const cover=p.cover?`<img src="${p.cover}" alt="" loading="lazy">`:`<div class="ph" style="--c1:${p.color||'#222'}"></div>`;
    const prev=p.preview?`<video src="${p.preview}" muted loop playsinline preload="none"></video>`:'';
    b.innerHTML=`<div class="thumb">${cover}${prev}</div><div class="meta"><span>${p.title}</span><span>${p.year}</span></div>`;
    const v=b.querySelector('video');
    if(v){
      b.addEventListener('mouseenter',()=>{v.classList.add('on');v.play().catch(()=>{})});
      b.addEventListener('mouseleave',()=>{v.classList.remove('on');v.pause();v.currentTime=0});
    }
    b.addEventListener('click',()=>open(p));
    grid.appendChild(b);
  });
}

let pluckBuf=null;
function decodePluck(){
  try{
    const bin=atob(PLUCK_SND.split(',')[1]), u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    actx.decodeAudioData(u8.buffer,b=>{pluckBuf=b},()=>{});
  }catch(e){}
}
function playPluck(strength){
  try{
    if(!actx)initAudio();
    if(actx.state==='suspended')actx.resume();
    if(!pluckBuf)return;
    const src=actx.createBufferSource(), g=actx.createGain();
    src.buffer=pluckBuf;
    g.gain.value=0.35+0.65*Math.max(0,Math.min(1,strength));   // plus la corde est tirée, plus c'est fort
    src.connect(g); g.connect(actx.destination); src.start(0);
  }catch(e){}
}
// Les navigateurs n'autorisent le son qu'après un premier clic ou toucher : on prépare l'audio à ce moment-là.
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!actx)initAudio();
  if(actx&&actx.state==='suspended')actx.resume();
},{passive:true}));

/* ---- Corde de guitare interactive ---- */
/* La corde vibre d'un seul bloc (mode fondamental) : un arc qui monte et descend,
   sans onde qui voyage de gauche à droite. */
(function(){
  const cv=document.getElementById('string'), ctx=cv.getContext('2d');
  const N=80,          // points de dessin (lissage)
        MAXPULL=22,    // distance de pincement max (px)
        GAIN=1.1,      // amplification de l'amplitude
        FREQ=2.2,      // vitesse de vibration (Hz) : plus bas = plus lent
        TAU=0.9,       // durée d'amortissement (s) : plus haut = vibre plus longtemps
        PAD=6;
  const W0=2*Math.PI*FREQ;
  let W=0,H=0,color='#fff',running=false,grabbed=false,prev=null;
  let amp=0, vel=0, target=0, last=0;

  const px=i=>PAD+(W-2*PAD)*i/(N-1);

  function size(){
    const dpr=window.devicePixelRatio||1;
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    color=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#fff';
    draw();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const cy=H/2;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=1.5; ctx.lineCap='round';
    const Y=i=>cy+amp*Math.sin(Math.PI*i/(N-1));   // toute la corde, même forme
    ctx.beginPath(); ctx.moveTo(px(0),Y(0));
    for(let i=1;i<N-1;i++){
      ctx.quadraticCurveTo(px(i),Y(i),(px(i)+px(i+1))/2,(Y(i)+Y(i+1))/2);
    }
    ctx.lineTo(px(N-1),Y(N-1)); ctx.stroke();
    [0,N-1].forEach(i=>{ctx.beginPath();ctx.arc(px(i),cy,2.5,0,Math.PI*2);ctx.fill()});
  }
  function loop(t){
    const dt=Math.min((t-last)/1000||0.016,0.033); last=t;
    if(grabbed){
      amp+=(target-amp)*0.35; vel=0;            // la corde suit la souris
    }else{
      // oscillation amortie : amp(t) = A0 · e^(-t/TAU) · cos(ωt)
      vel+=(-W0*W0*amp-(2/TAU)*vel)*dt;
      amp+=vel*dt;
    }
    draw();
    if(grabbed||Math.abs(amp)>0.15||Math.abs(vel)>2) requestAnimationFrame(loop);
    else{amp=0;vel=0;running=false;draw()}
  }
  function start(){ if(!running){running=true;last=performance.now();requestAnimationFrame(loop)} }
  function release(){ grabbed=false; playPluck(Math.abs(amp)/(MAXPULL*GAIN)); start(); }

  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    const cyv=e.clientY-r.top-H/2;
    const clamp=Math.max(-MAXPULL,Math.min(MAXPULL,cyv))*GAIN;
    if(prev!==null && !grabbed && Math.sign(prev)!==Math.sign(cyv) && cyv!==0){
      // la souris traverse la corde : on la pince
      target=clamp; grabbed=true;
      if(Math.abs(cyv)>=MAXPULL){amp=target;release()}   // passage rapide : elle part tout de suite
    }else if(grabbed){
      if(Math.abs(cyv)>=MAXPULL) release();               // trop loin : relâchée, elle vibre
      else target=clamp;
    }
    prev=cyv; start();
  });
  cv.addEventListener('pointerleave',()=>{prev=null;if(grabbed)release()});
  cv.addEventListener('pointerup',()=>{if(grabbed)release()});
  window.addEventListener('resize',size);
  size();
})();

buildFilters(); render();
</script>
</body>
</html>
